name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # de hora em hora, puxa as novidades do Notion
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.mudou.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar conversor de fotos do iPhone (HEIC)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libheif-examples libheif-plugin-libde265 || sudo apt-get install -y -qq libheif-examples

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Recuperar fotos já processadas
        uses: actions/cache@v4
        with:
          path: .cache/fotos
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-

      - name: Gerar o site a partir do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/build.mjs

      # Na atualização de hora em hora, só publica se algo mudou no Notion.
      - name: Ver se há novidades
        id: mudou
        run: |
          nova=$(cat site/versao.txt)
          atual=$(curl -fsSL --max-time 20 "https://ledressclub.com.br/versao.txt?t=$(date +%s)" || echo "")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$nova" = "$atual" ]; then
            echo "Nada mudou desde a última publicação ($nova)."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "Publicando versão $nova (no ar: ${atual:-nenhuma})."
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.mudou.outputs.publicar == 'sim'
        uses: actions/configure-pages@v5

      - if: steps.mudou.outputs.publicar == 'sim'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: gerar
    if: needs.gerar.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # O GitHub às vezes demora a "enxergar" o pacote do site; espera e tenta de novo.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
