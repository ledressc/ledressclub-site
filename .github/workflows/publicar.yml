name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # de hora em hora, puxa as novidades do Notion
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Recuperar fotos já processadas
        uses: actions/cache@v4
        with:
          path: .cache/fotos
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-

      - name: Gerar o site a partir do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
